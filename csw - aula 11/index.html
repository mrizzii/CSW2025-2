<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site com Google Fonts</title>

  <!-- Importando as fontes do Google -->
  <link href="https://fonts.googleapis.com/css2?family=Lora&family=Open+Sans&family=Sedan:ital@0;1&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 40px;
      background-color: #f9f9f9;
      color: #333;
    }

    h1 {
      font-family: 'Sedan', serif;
      font-size: 2.5em;
    }

    h2 {
      font-family: 'Open Sans', sans-serif;
      font-size: 2em;
    }

    p {
      font-family: 'Lora', serif;
      font-size: 1.2em;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>Esta é uma tag H1 com a fonte Sedan</h1>
  <h2>Esta é uma tag H2 com a fonte Open Sans</h2>
  <p>Este é um parágrafo usando a fonte Lora. Ele serve como exemplo para mostrar como o texto do corpo pode parecer com essa fonte serifada elegante e legível.</p>

  <a href="./pag.download/download"> Página de acesso para Download de Fontes</a>
</body>
</html>
